name: Release Management

on:
  release:
    types: [published] # Runs when a draft is published

permissions:
  contents: write
  pull-requests: write

jobs:
  update_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main # Checkout main branch instead of detached HEAD at tag

      - name: Get version from published release
        id: get_version
        uses: actions/github-script@v7
        with:
          script: |
            // Get version from the release that triggered this workflow
            const version = context.payload.release.tag_name.replace(/^v/, '');
            core.setOutput('version', version);

      - name: Update pyproject.toml version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # Use sed to update version only under [project] section
          sed -i '/^\[project\]/,/^\[.*\]/ s/^version = .*/version = "'$VERSION'"/' pyproject.toml

      - name: Commit and push version update
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add pyproject.toml
          git commit -m "chore: update version to ${{ steps.get_version.outputs.version }}"
          git push origin master
