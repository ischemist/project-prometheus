# ============================================================================
#
# CalcFlow Docs — zensical.toml
#
# ============================================================================

[project]
site_name = "CalcFlow Docs"
site_description = "CalcFlow is a zero-dependency Python library for quantum chemistry calculation I/O — parsing outputs and generating inputs for Q-Chem and ORCA."
site_author = "isChemist Group"
site_url = "https://calcflow.ischemist.com/"
repo_url = "https://github.com/ischemist/project-prometheus"
repo_name = "ischemist/project-prometheus"
copyright = """
CC-BY &copy; 2025 isChemist Group
"""
nav = [
  { "Home" = "index.md" },
  { "Quick Start" = "quick-start.md" },
  { "Concepts" = "concepts.md" },
  { "Guides" = [
    "guides/parsing.md",
    "guides/inputs.md",
    "guides/geometry.md",
    "guides/slurm.md",
    "guides/agentic.md",
  ] },
  { "Developers" = [
    "developers/parsers.md",
    "developers/testing.md",
    "developers/schema-versioning.md",
  ] }
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.font]
text = "Geist"
code = "Geist Mono"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ischemist/project-prometheus"
